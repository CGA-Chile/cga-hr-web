name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      # Build last: it is the slowest step, so a lint or type error fails fast.
      - name: Build
        run: npm run build
        env:
          # The build only needs these to be present and syntactically valid.
          # Real values are never in CI; nothing here talks to a live database.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  # Deliberately absent: any step that applies a migration.
  # Migrations are applied by an attended actor, after a backup, never by CI.
  # See docs/adr/0009-the-agent-applies-migrations.md.
