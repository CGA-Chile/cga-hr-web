name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The Next.js app does not exist yet — this repository currently holds only
      # documentation and configuration. Without this guard the very first pull
      # request could not pass its own required checks.
      # DELETE THIS STEP (and the `if:` conditions below) once package.json exists.
      - name: Detect application
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet — skipping application checks."
          fi

      - name: Set up Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        run: npx tsc --noEmit

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: npm run test

      # Build last: it is the slowest step, so a lint or type error fails fast.
      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: npm run build
        env:
          # The build only needs these to be present and syntactically valid.
          # Real values are never in CI; nothing here talks to a live database.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  # Deliberately absent: any step that applies a migration.
  # Migrations reach production through a human, not through CI.
  # See docs/adr/0003-single-supabase-project.md.
